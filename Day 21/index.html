<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: aqua;
        }
        .yellow{
            color: yellow;
        }
        .cpurple{
            color: purple;
        }
         
        .cred{
            color: rgb(93, 188, 29);
        }
        [data-x=a]{
            color: rgb(36, 43, 235);}
        /*   [[inline style>id selector>class or attribute selector>element selector>universal selector]]
        }*/

            a.kartikclass.barkha-class[href]:hover{
                color: rgb(211, 23, 136);
            }

    </style>
</head>
<body>
    <div>
        <h1  class="yellow cred cpurple" data-x="a">CSS specificity</h1>
    </div>
</body>
</html>
