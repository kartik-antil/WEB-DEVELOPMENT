<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors </title>
    <style>
        /*Element Selector*/
        /*div{
            background-color: red;
        }*/
            /*Class Selector*/
            .red{
                background-color: red;
            }
            /*ID Selector*/
            #green{
                background-color: green;
            }
            /*child Selector*/
            div > p{
                color:blue;
                background-color:brown;
            }
            /*Descendant Selector*/
            div p{
                color:blue;
                background-color:brown;
            }
           /*Universal Selector*/
            * {
                margin:0;
                padding:0;
            }
           /* pseudo selectors*/
            a:visited{
                color: yellow;
            }

            a:link{
                color:green;
            }

            a:active{
                background-color: red;
            }

            div:hover{
                background-color: yellow;
            }
            p:first-child{
                background-color: aqua;
            }
    </style>
</head>
<body>
    <divc lass="one"
    i am one
</div>
    <div class="red">
        I am a div 
    </div>
    <div id="green">
        the another div 
    </div>
    <div>
        <article>

            <p> i am para inside div</p>
        </article>
    </div>
    
    <a href="https://www.google.com">go to google</a>
    <br>
    <a href="https://www.facebook.com">go to facebook</a>
</body>
</body>
</html>
